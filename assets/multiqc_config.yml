report_comment: >
  This report has been generated by the <a href="https://github.com/ampfalaeris/envmetag/releases/tag/0.1.1" target="_blank">ampfalaeris/envmetag</a> analysis pipeline.
report_section_order:
  "ampfalaeris-envmetag-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "ampfalaeris-envmetag-summary":
    order: -1002

export_plots: true

disable_version_detection: true

# FastQC runs twice (raw and fastp-trimmed); give each its own section
module_order:
  - fastqc:
      name: "FastQC (raw)"
      anchor: "fastqc_raw"
      path_filters:
        - "*_raw_*_fastqc.zip"
  - fastp
  - fastqc:
      name: "FastQC (trimmed)"
      anchor: "fastqc_trimmed"
      path_filters:
        - "*_trimmed_*_fastqc.zip"
  - bowtie2
  - hostile

# collapse per-step suffixes so each sample is one General Statistics row
extra_fn_clean_exts:
  - "_raw"
  - "_trimmed"
  - "_phix"

table_sample_merge:
  "Read 1": "_1"
  "Read 2": "_2"
