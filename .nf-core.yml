repository_type: pipeline

nf_core_version: 4.2.0

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-envmetag_logo_light.png
    - docs/images/nf-core-envmetag_logo_light.png
    - docs/images/nf-core-envmetag_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
    - process.cpus
    - process.memory
    - process.time
    - custom_config
    - params.custom_config_version
    - params.custom_config_base
  multiqc_config:
    - report_comment
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-envmetag_logo_light.png
    - docs/images/nf-core-envmetag_logo_light.png
    - docs/images/nf-core-envmetag_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - conf/igenomes.config

template:
  org: ampfalaeris
  name: envmetag
  description: Shotgun metagenomic profiling of environmental samples, with curated
    marker genes for sulfur, methane, and nitrogen cycling and hydrocarbon degradation.
  author: Adam M. Partin
  version: 0.1.0dev
  force: true
  outdir: .
  skip_features:
    - igenomes
    - nf_core_configs
  is_nfcore: false
